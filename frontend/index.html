<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inventory IMS</title>

  <!-- TailwindCDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#2563eb",
            primaryDark: "#1d4ed8",
            sidebar: "#020617"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100">

<div id="app"></div>

<script>
const API = "http://localhost:8000";

// =============== GLOBAL STATE ==================
let state = {
  token: localStorage.getItem("token") || null,
  currentView: "dashboard",
  dashboard: null,
  me: null,            // <--- NEW (user profile)
  products: [],
  warehouses: [],
  locations: [],
  receipts: [],
  deliveries: [],
  transfers: [],
  adjustments: [],
  stock: [],
  ledger: [],
  filters: {
    docType: "ALL",
    status: "ALL",
    warehouse: "",
    category: ""
  },
};

// =============== API HELPER ====================
async function api(path, options = {}) {
  const headers = options.headers || {};
  if (!options.noAuth && state.token) {
    headers["Authorization"] = "Bearer " + state.token;
  }
  if (options.json) {
    headers["Content-Type"] = "application/json";
  }

  const res = await fetch(API + path, {
    method: options.method || "GET",
    headers,
    body: options.body
  });

  if (!res.ok) {
    let message = "Request failed " + res.status;
    try {
      const data = await res.json();
      message = data.detail || data.message || message;
    } catch {}
    throw new Error(message);
  }
  try { return await res.json(); } catch { return null; }
}

// =============== LOGIN =========================

async function handleLogin(e) {
  e.preventDefault();
  const email = loginEmail.value;
  const password = loginPassword.value;

  const formData = new FormData();
  formData.append("username", email);
  formData.append("password", password);

  try {
    const data = await api("/login", { method: "POST", body: formData, noAuth: true });
    state.token = data.access_token;
    localStorage.setItem("token", state.token);

    await loadAllData();
    render();
  } catch (err) {
    alert("Login failed: " + err.message);
  }
}

// =============== SIGNUP ========================

async function handleSignup(e) {
  e.preventDefault();
  const name = signupName.value;
  const email = signupEmail.value;
  const password = signupPassword.value;
  const role = signupRole.value;

  try {
    const data = await api("/signup", {
      method: "POST",
      json: true,
      body: JSON.stringify({ name, email, password, role }),
      noAuth: true
    });

    state.token = data.access_token;
    localStorage.setItem("token", state.token);

    await loadAllData();
    render();
  } catch (err) {
    alert("Signup failed: " + err.message);
  }
}

function logout() {
  state.token = null;
  localStorage.removeItem("token");
  render();
}

// ===== OTP ======

async function handleRequestOTP(e) {
  e.preventDefault();
  try {
    const email = otpEmail.value;
    const data = await api("/request-reset-otp", {
      method: "POST",
      json: true,
      body: JSON.stringify({ email }),
      noAuth: true
    });
    alert("OTP: " + data.otp);
  } catch (err) {
    alert(err.message);
  }
}

async function handleResetPassword(e) {
  e.preventDefault();
  const email = otpEmail.value;
  const otp = otpCode.value;
  const newPassword = otpNewPassword.value;

  try {
    await api("/reset-password", {
      method: "POST",
      json: true,
      body: JSON.stringify({ email, otp, newPassword }),
      noAuth: true
    });
    alert("Password reset, login again.");
  } catch (err) {
    alert(err.message);
  }
}


// =============== LOAD ALL ======================

async function loadAllData() {
  try {
    state.me = await api("/me");       // <---- NEW 🎉
    state.dashboard = await api("/dashboard");
    state.products = await api("/products");
    state.warehouses = await api("/warehouses");
    state.locations = await api("/locations");
    state.receipts = await api("/receipts");
    state.deliveries = await api("/deliveries");
    state.transfers = await api("/transfers");
    state.adjustments = await api("/adjustments");
    state.stock = await api("/stock");
    state.ledger = await api("/ledger");
  } catch (err) {
    console.error("Load error:", err);
  }
}

// ======================================================
// =============== VIEW HELPERS =========================
// ======================================================

function updateFilter(key, value) {
  state.filters[key] = value;
  render();
}

function setView(view) {
  state.currentView = view;
  render();
}


// ======================================================
// =================== DASHBOARD ========================
// ======================================================

function renderDashboard() {
  const d = state.dashboard || {
    lowStock: 0,
    outOfStock: 0,
    pendingReceipts: 0,
    pendingDeliveries: 0,
    pendingTransfers: 0
  };

  return `
    <h2 class="text-xl font-semibold mb-2">Dashboard</h2>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
      ${renderKpi("Total Products", state.products.length)}
      ${renderKpi("Low Stock", d.lowStock)}
      ${renderKpi("Out of Stock", d.outOfStock)}
      ${renderKpi("Receipts", d.pendingReceipts)}
      ${renderKpi("Deliveries", d.pendingDeliveries)}
      ${renderKpi("Transfers", d.pendingTransfers)}
    </div>

    <div class="bg-white rounded-xl shadow p-4">
      <h3 class="text-sm font-semibold mb-2">Recent Movements</h3>
      <div class="overflow-x-auto max-h-64">
        <table class="min-w-full text-xs">
          <thead>
            <tr class="bg-slate-100">
              <th class="px-2 py-1 text-left">Type</th>
              <th class="px-2 py-1 text-left">Product</th>
              <th class="px-2 py-1 text-left">From</th>
              <th class="px-2 py-1 text-left">To</th>
              <th class="px-2 py-1 text-left">Qty</th>
            </tr>
          </thead>
          <tbody>
            ${state.ledger.slice(0,10).map(x => `
              <tr class="border-t">
                <td class="px-2 py-1">${x.type}</td>
                <td class="px-2 py-1">${x.product}</td>
                <td class="px-2 py-1">${x.fromLocation || "-"}</td>
                <td class="px-2 py-1">${x.toLocation || "-"}</td>
                <td class="px-2 py-1">${x.qty}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderKpi(name, value) {
  return `
    <div class="bg-white rounded-xl shadow p-4">
      <div class="text-xs text-slate-500">${name}</div>
      <div class="text-2xl font-semibold">${value}</div>
    </div>
  `;
}

// ==================== PRODUCTS ========================

// ======================================================
// ===================== NEW PROFILE =====================
// ======================================================

function renderProfile() {
  const me = state.me;

  if (!me) return `<p class="text-slate-500">Loading...</p>`;

  return `
    <div class="max-w-lg bg-white rounded-xl shadow p-6">

      <h2 class="text-xl font-semibold mb-4">My Profile</h2>

      <!-- Avatar -->
      <div class="flex items-center gap-4 mb-6">
        <img src="${API + me.avatarUrl}" 
             onerror="this.src='https://placehold.co/100x100?text=NO+IMG'"
             class="w-24 h-24 rounded-full border shadow object-cover" />

        <form onsubmit="uploadAvatar(event)" class="text-xs space-y-2">
          <input id="avatarFile" type="file" accept="image/*" class="text-xs" required />
          <button class="block bg-primary text-white px-3 py-1 rounded">Upload</button>
        </form>
      </div>

      <!-- Info -->
      <div class="space-y-2 text-sm">
        <p><b>Name:</b> ${me.name}</p>
        <p><b>Email:</b> ${me.email}</p>
        <p><b>Role:</b> ${me.role}</p>
      </div>

      <!-- Divider -->
      <hr class="my-4">

      <!-- Change Password -->
      <h3 class="font-semibold text-sm mb-2">Change Password</h3>
      <form onsubmit="changePassword(event)" class="space-y-2 text-xs">
        <input id="oldPwd" type="password" class="w-full border rounded px-2 py-1.5" placeholder="Old Password" required />
        <input id="newPwd" type="password" class="w-full border rounded px-2 py-1.5" placeholder="New Password" required />
        <button class="w-full bg-primary text-white py-1.5 rounded">Update Password</button>
      </form>

    </div>
  `;
}


// ======================================================
// ========== PROFILE FUNCTIONS (UPLOAD + PASSWORD) ======
// ======================================================

async function uploadAvatar(e) {
  e.preventDefault();

  const fileInput = document.getElementById("avatarFile");
  if (!fileInput.files.length) return alert("Choose a file");

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  try {
    const data = await api("/profile/avatar", {
      method: "POST",
      body: formData
    });

    alert("Avatar updated!");

    await loadAllData();
    render();

  } catch (err) {
    alert(err.message);
  }
}

async function changePassword(e) {
  e.preventDefault();

  const oldPassword = oldPwd.value;
  const newPassword = newPwd.value;

  try {
    await api("/change-password", {
      method: "POST",
      json: true,
      body: JSON.stringify({ oldPassword, newPassword })
    });

    alert("Password updated!");

  } catch (err) {
    alert(err.message);
  }

// ======================================================
// ====================== LAYOUT ========================
// ======================================================

function renderLayout(contentHTML) {
  const me = state.me;
  const username = me ? me.name : "User";
  const role = me ? me.role : "";

  const views = [
    "dashboard",
    "products",
    "receipts",
    "deliveries",
    "transfers",
    "adjustments",
    "stock",
    "ledger",
    "settings",
    "profile"
  ];

  return `
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-60 bg-sidebar text-slate-100 flex flex-col">
      <div class="px-4 py-4 border-b border-slate-800">
        <div class="text-lg font-semibold">Inventory IMS</div>
        <div class="text-xs text-slate-400">Real-time stock control</div>
      </div>
      <nav class="flex-1 px-3 py-3 text-sm space-y-1">
        ${views.map(view => `
          <button
            onclick="setView('${view}')"
            class="w-full text-left px-3 py-2 rounded-md hover:bg-slate-800 ${state.currentView === view ? "bg-primary" : ""}">
            ${view[0].toUpperCase() + view.slice(1)}
          </button>
        `).join("")}
      </nav>
      <div class="px-4 py-3 border-t border-slate-800 text-xs">
        <div class="mb-2">
          <div class="font-semibold truncate">${username}</div>
          <div class="text-slate-400">${role}</div>
        </div>
        <button onclick="logout()" class="w-full bg-red-500 hover:bg-red-600 text-sm py-2 rounded-md">
          Logout
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 bg-slate-100">
      <header class="h-14 bg-white border-b border-slate-200 flex items-center px-6 justify-between">
        <div class="font-semibold text-slate-800 text-lg capitalize">
          ${state.currentView}
        </div>
        <div class="text-xs text-slate-500">
          Inventory Managers & Warehouse Staff
        </div>
      </header>
      <section class="p-4 sm:p-6">
        ${contentHTML}
      </section>
    </main>
  </div>
  `;
}


// ======================================================
// ===================== MAIN RENDER ====================
// ======================================================

function render() {
  const app = document.getElementById("app");

  if (!state.token) {
    app.innerHTML = renderLoginSignup();

    // Setup tab toggle after DOM inserted
    setTimeout(() => {
      const loginPanel = document.getElementById("loginPanel");
      const signupPanel = document.getElementById("signupPanel");
      const tabLogin = document.getElementById("tabLogin");
      const tabSignup = document.getElementById("tabSignup");

      if (!loginPanel || !signupPanel || !tabLogin || !tabSignup) return;

      tabLogin.onclick = () => {
        loginPanel.classList.remove("hidden");
        signupPanel.classList.add("hidden");
        tabLogin.classList.add("bg-primary", "text-white");
        tabSignup.classList.remove("bg-primary", "text-white");
      };

      tabSignup.onclick = () => {
        loginPanel.classList.add("hidden");
        signupPanel.classList.remove("hidden");
        tabSignup.classList.add("bg-primary", "text-white");
        tabLogin.classList.remove("bg-primary", "text-white");
      };
    }, 0);

    return;
  }

  let content = "";
  switch (state.currentView) {
    case "dashboard":   content = renderDashboard();   break;
    case "products":    content = renderProducts();    break;
    case "receipts":    content = renderReceipts();    break;
    case "deliveries":  content = renderDeliveries();  break;
    case "transfers":   content = renderTransfers();   break;
    case "adjustments": content = renderAdjustments(); break;
    case "stock":       content = renderStock();       break;
    case "ledger":      content = renderLedger();      break;
    case "settings":    content = renderSettings();    break;
    case "profile":     content = renderProfile();     break;
    default:            content = renderDashboard();
  }

  app.innerHTML = renderLayout(content);
}


// ======================================================
// ======================= BOOT =========================
// ======================================================

(async function init() {
  if (state.token) {
    await loadAllData();
  }
  render();
})();
</script>
