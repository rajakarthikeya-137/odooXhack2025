<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inventory IMS</title>

  <!-- TailwindCDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#2563eb",
            primaryDark: "#1d4ed8",
            sidebar: "#020617"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100">

<div id="app"></div>

<script>
const API = "http://localhost:8000";

// =============== SIMPLE STATE HELPERS =================
let state = {
  token: localStorage.getItem("token") || null,
  currentView: "dashboard", // dashboard, products, receipts, deliveries, transfers, adjustments, stock, ledger, settings, profile
  dashboard: null,
  products: [],
  warehouses: [],
  locations: [],
  receipts: [],
  deliveries: [],
  transfers: [],
  adjustments: [],
  stock: [],
  ledger: [],
  filters: {
    docType: "ALL",
    status: "ALL",
    warehouse: "",
    category: ""
  },
};

// =============== HTTP HELPERS =========================
async function api(path, options = {}) {
  const headers = options.headers || {};
  if (!options.noAuth && state.token) {
    headers["Authorization"] = "Bearer " + state.token;
  }
  if (options.json) {
    headers["Content-Type"] = "application/json";
  }

  const res = await fetch(API + path, {
    method: options.method || "GET",
    headers,
    body: options.body
  });

  if (!res.ok) {
    let message = "Request failed " + res.status;
    try {
      const data = await res.json();
      message = data.detail || data.message || message;
    } catch { }
    throw new Error(message);
  }
  try { return await res.json(); } catch { return null; }
}

// =============== AUTH LOGIC ===========================

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const formData = new FormData();
  formData.append("username", email);
  formData.append("password", password);

  try {
    const data = await api("/login", {
      method: "POST",
      body: formData,
      noAuth: true
    });
    state.token = data.access_token;
    localStorage.setItem("token", state.token);
    await loadAllData();
    render();
  } catch (err) {
    alert("Login failed: " + err.message);
  }
}

async function handleSignup(e) {
  e.preventDefault();
  const name = document.getElementById("signupName").value;
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;
  const role = document.getElementById("signupRole").value;

  try {
    const data = await api("/signup", {
      method: "POST",
      json: true,
      body: JSON.stringify({ name, email, password, role }),
      noAuth: true
    });
    state.token = data.access_token;
    localStorage.setItem("token", state.token);
    await loadAllData();
    render();
  } catch (err) {
    alert("Signup failed: " + err.message);
  }
}

function logout() {
  state.token = null;
  localStorage.removeItem("token");
  render();
}

// OTP
async function handleRequestOTP(e) {
  e.preventDefault();
  const email = document.getElementById("otpEmail").value;
  try {
    const data = await api("/request-reset-otp", {
      method: "POST",
      json: true,
      body: JSON.stringify({ email }),
      noAuth: true
    });
    alert("OTP generated (for demo): " + data.otp);
  } catch (err) {
    alert("OTP request failed: " + err.message);
  }
}

async function handleResetPassword(e) {
  e.preventDefault();
  const email = document.getElementById("otpEmail").value;
  const otp = document.getElementById("otpCode").value;
  const newPassword = document.getElementById("otpNewPassword").value;
  try {
    await api("/reset-password", {
      method: "POST",
      json: true,
      body: JSON.stringify({ email, otp, newPassword }),
      noAuth: true
    });
    alert("Password reset successful, please login.");
  } catch (err) {
    alert("Reset failed: " + err.message);
  }
}

// =============== DATA LOADERS =========================

async function loadAllData() {
  try {
    state.dashboard = await api("/dashboard");
    state.products = await api("/products");
    state.warehouses = await api("/warehouses");
    state.locations = await api("/locations");
    state.receipts = await api("/receipts");
    state.deliveries = await api("/deliveries");
    state.transfers = await api("/transfers");
    state.adjustments = await api("/adjustments");
    state.stock = await api("/stock");
    state.ledger = await api("/ledger");
  } catch (err) {
    console.error("Load error", err);
  }
}

// =============== SIMPLE FORM HANDLERS =================

async function handleCreateProduct(e) {
  e.preventDefault();
  const name = document.getElementById("prodName").value;
  const sku = document.getElementById("prodSku").value;
  const category = document.getElementById("prodCategory").value;
  const uom = document.getElementById("prodUom").value;
  const reorderPoint = Number(document.getElementById("prodReorderPoint").value || 0);
  const reorderQty = Number(document.getElementById("prodReorderQty").value || 0);

  try {
    await api("/products", {
      method: "POST",
      json: true,
      body: JSON.stringify({ name, sku, category, uom, reorderPoint, reorderQty })
    });
    alert("Product created");
    state.products = await api("/products");
    render();
  } catch (err) {
    alert("Error: " + err.message);
  }
}

async function handleCreateWarehouse(e) {
  e.preventDefault();
  const name = document.getElementById("whName").value;
  const code = document.getElementById("whCode").value;
  const address = document.getElementById("whAddress").value;
  try {
    await api("/warehouses", {
      method: "POST",
      json: true,
      body: JSON.stringify({ name, code, address })
    });
    alert("Warehouse created");
    state.warehouses = await api("/warehouses");
    render();
  } catch (err) {
    alert("Error: " + err.message);
  }
}

async function handleCreateLocation(e) {
  e.preventDefault();
  const name = document.getElementById("locName").value;
  const code = document.getElementById("locCode").value;
  const warehouse = document.getElementById("locWarehouse").value;
  try {
    await api("/locations", {
      method: "POST",
      json: true,
      body: JSON.stringify({ name, code, warehouse })
    });
    alert("Location created");
    state.locations = await api("/locations");
    render();
  } catch (err) {
    alert("Error: " + err.message);
  }
}

// Receipts (incoming)
async function handleCreateReceipt(e) {
  e.preventDefault();
  const supplierName = document.getElementById("rcSupplier").value;
  const docNumber = document.getElementById("rcDocNumber").value;
  const warehouse = document.getElementById("rcWarehouse").value;
  const product = document.getElementById("rcProduct").value;
  const location = document.getElementById("rcLocation").value;
  const qtyOrdered = Number(document.getElementById("rcQtyOrdered").value || 0);
  const qtyReceived = Number(document.getElementById("rcQtyReceived").value || 0);

  const payload = {
    supplierName,
    docNumber,
    warehouse,
    status: "DONE",
    lines: [{ product, location, qtyOrdered, qtyReceived }]
  };

  try {
    await api("/receipts", {
      method: "POST",
      json: true,
      body: JSON.stringify(payload)
    });
    alert("Receipt created (+stock)");
    state.receipts = await api("/receipts");
    state.stock = await api("/stock");
    state.ledger = await api("/ledger");
    state.dashboard = await api("/dashboard");
    render();
  } catch (err) {
    alert("Error: " + err.message);
  }
}

// Deliveries
async function handleCreateDelivery(e) {
  e.preventDefault();
  const customerName = document.getElementById("dlCustomer").value;
  const docNumber = document.getElementById("dlDocNumber").value;
  const warehouse = document.getElementById("dlWarehouse").value;
  const product = document.getElementById("dlProduct").value;
  const fromLocation = document.getElementById("dlLocation").value;
  const qtyPlanned = Number(document.getElementById("dlQtyPlanned").value || 0);
  const qtyDelivered = Number(document.getElementById("dlQtyDelivered").value || 0);

  const payload = {
    customerName,
    docNumber,
    warehouse,
    status: "DONE",
    lines: [{ product, fromLocation, qtyPlanned, qtyDelivered }]
  };

  try {
    await api("/deliveries", {
      method: "POST",
      json: true,
      body: JSON.stringify(payload)
    });
    alert("Delivery created (-stock)");
    state.deliveries = await api("/deliveries");
    state.stock = await api("/stock");
    state.ledger = await api("/ledger");
    state.dashboard = await api("/dashboard");
    render();
  } catch (err) {
    alert("Error: " + err.message);
  }
}

// Transfers
async function handleCreateTransfer(e) {
  e.preventDefault();
  const fromWarehouse = document.getElementById("trFromWh").value;
  const toWarehouse = document.getElementById("trToWh").value;
  const product = document.getElementById("trProduct").value;
  const fromLocation = document.getElementById("trFromLoc").value;
  const toLocation = document.getElementById("trToLoc").value;
  const qty = Number(document.getElementById("trQty").value || 0);

  const payload = {
    fromWarehouse,
    toWarehouse,
    status: "DONE",
    lines: [{ product, fromLocation, toLocation, qty }]
  };

  try {
    await api("/transfers", {
      method: "POST",
      json: true,
      body: JSON.stringify(payload)
    });
    alert("Transfer done");
    state.transfers = await api("/transfers");
    state.stock = await api("/stock");
    state.ledger = await api("/ledger");
    render();
  } catch (err) {
    alert("Error: " + err.message);
  }
}

// Adjustments
async function handleCreateAdjustment(e) {
  e.preventDefault();
  const warehouse = document.getElementById("adWarehouse").value;
  const reason = document.getElementById("adReason").value;
  const product = document.getElementById("adProduct").value;
  const location = document.getElementById("adLocation").value;
  const countedQty = Number(document.getElementById("adCountedQty").value || 0);

  const payload = {
    warehouse,
    reason,
    status: "DONE",
    lines: [{ product, location, countedQty }]
  };

  try {
    await api("/adjustments", {
      method: "POST",
      json: true,
      body: JSON.stringify(payload)
    });
    alert("Adjustment applied");
    state.adjustments = await api("/adjustments");
    state.stock = await api("/stock");
    state.ledger = await api("/ledger");
    state.dashboard = await api("/dashboard");
    render();
  } catch (err) {
    alert("Error: " + err.message);
  }
}

// =============== VIEWS (HTML STRING BUILDERS) =========

function renderLoginSignup() {
  return `
  <div class="min-h-screen flex items-center justify-center bg-slate-900">
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md">
      <h1 class="text-2xl font-bold text-slate-900 mb-2 text-center">
        Inventory IMS
      </h1>
      <p class="text-xs text-slate-500 mb-4 text-center">
        Centralized, real-time stock control
      </p>

      <div class="grid grid-cols-2 mb-4 border border-slate-200 rounded-lg overflow-hidden text-xs">
        <button id="tabLogin" class="tab-btn bg-primary text-white py-2">Login</button>
        <button id="tabSignup" class="tab-btn bg-white text-slate-600 py-2">Sign Up</button>
      </div>

      <!-- LOGIN -->
      <div id="loginPanel">
        <form onsubmit="handleLogin(event)" class="space-y-3 text-sm">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
            <input id="loginEmail" class="w-full border rounded px-3 py-2 text-sm" required />

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>

          </div>
          <button type="submit" class="w-full bg-primary text-white py-2 rounded-md text-sm font-semibold">

          </button>
        </form>

        <div class="mt-4 border-t pt-3">
          <p class="text-xs text-slate-500 mb-2">Forgot Password? Use OTP Reset:</p>
          <form onsubmit="handleResetPassword(event)" class="space-y-2 text-xs">
            <input id="otpEmail" class="w-full border rounded px-2 py-1.5" placeholder="Email" />
            <button onclick="handleRequestOTP(event)" class="w-full bg-slate-800 text-white py-1.5 rounded mb-2">
              Request OTP
            </button>
            <input id="otpCode" class="w-full border rounded px-2 py-1.5" placeholder="OTP Code" />
            <input id="otpNewPassword" type="password" class="w-full border rounded px-2 py-1.5" placeholder="New Password" />
            <button type="submit" class="w-full bg-primary text-white py-1.5 rounded">
              Reset Password
            </button>
          </form>
        </div>
      </div>

      <!-- SIGNUP -->
      <div id="signupPanel" class="hidden">
        <form onsubmit="handleSignup(event)" class="space-y-3 text-sm">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Name</label>
            <input id="signupName" class="w-full border rounded px-3 py-2 text-sm" required />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
            <input id="signupEmail" type="email" class="w-full border rounded px-3 py-2 text-sm" required />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
            <input id="signupPassword" type="password" class="w-full border rounded px-3 py-2 text-sm" required />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Role</label>
            <select id="signupRole" class="w-full border rounded px-3 py-2 text-sm">
              <option value="STOCK_MASTER">StockMaster</option>
              <option value="INVENTORY_MANAGER">Inventory Manager</option>
              <option value="WAREHOUSE_STAFF">Warehouse Staff</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-primary text-white py-2 rounded-md text-sm font-semibold">
            Create Account
          </button>
        </form>
      </div>
    </div>
  </div>
  `;
}

function renderLayout(contentHTML) {
  return `
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-60 bg-sidebar text-slate-100 flex flex-col">
      <div class="px-4 py-4 border-b border-slate-800">
        <div class="text-lg font-semibold">Inventory IMS</div>
        <div class="text-xs text-slate-400">Real-time stock control</div>
      </div>
      <nav class="flex-1 px-3 py-3 text-sm space-y-1">
        ${["dashboard","products","receipts","deliveries","transfers","adjustments","stock","ledger","settings","profile"].map(view => `
          <button onclick="setView('${view}')" class="w-full text-left px-3 py-2 rounded-md hover:bg-slate-800 ${state.currentView === view ? "bg-primary" : ""}">
            ${view[0].toUpperCase() + view.slice(1)}
          </button>
        `).join("")}
      </nav>
      <div class="px-4 py-4 border-t border-slate-800">
        <button onclick="logout()" class="w-full bg-red-500 hover:bg-red-600 text-sm py-2 rounded-md">
          Logout
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 bg-slate-100">
      <header class="h-14 bg-white border-b border-slate-200 flex items-center px-6 justify-between">
        <div class="font-semibold text-slate-800 text-lg capitalize">${state.currentView}</div>
        <div class="text-xs text-slate-500">Inventory Managers & Warehouse Staff</div>
      </header>
      <section class="p-4 sm:p-6">
        ${contentHTML}
      </section>
    </main>
  </div>
  `;
}

// --- Individual views ---

function renderDashboard() {
  const d = state.dashboard || {
    lowStock: 0,
    outOfStock: 0,
    pendingReceipts: 0,
    pendingDeliveries: 0,
    pendingTransfers: 0
  };

  return `
    <h2 class="text-xl font-semibold text-slate-900 mb-2">Dashboard</h2>
    <p class="text-xs text-slate-500 mb-4">
      Snapshot of inventory health and operations.
    </p>
    <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6">
      ${renderKpi("Total Products", state.products.length, "distinct SKUs in catalog")}
      ${renderKpi("Low Stock", d.lowStock, "at or below reorder point")}
      ${renderKpi("Out of Stock", d.outOfStock, "no quantity available")}
      ${renderKpi("Pending Receipts", d.pendingReceipts, "incoming goods")}
      ${renderKpi("Pending Deliveries", d.pendingDeliveries, "outgoing goods")}
      ${renderKpi("Transfers Scheduled", d.pendingTransfers, "internal moves")}
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4 text-xs text-slate-600">
      <h3 class="font-semibold text-slate-800 mb-2">Filters / Move History Preview</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
        <select id="filterDocType" class="border rounded px-2 py-1.5 text-xs" onchange="updateFilter('docType', this.value)">
          <option value="ALL">All Docs</option>
          <option value="RECEIPT">Receipts</option>
          <option value="DELIVERY">Delivery</option>
          <option value="TRANSFER">Internal</option>
          <option value="ADJUSTMENT">Adjustments</option>
        </select>
        <select id="filterStatus" class="border rounded px-2 py-1.5 text-xs" onchange="updateFilter('status', this.value)">
          <option value="ALL">All Statuses</option>
          <option value="DONE">Done</option>
        </select>
        <input id="filterWarehouse" class="border rounded px-2 py-1.5 text-xs" placeholder="Warehouse" onchange="updateFilter('warehouse', this.value)" />
        <input id="filterCategory" class="border rounded px-2 py-1.5 text-xs" placeholder="Category" onchange="updateFilter('category', this.value)" />
      </div>
      <div class="overflow-x-auto max-h-52">
        <table class="min-w-full text-xs">
          <thead>
            <tr class="bg-slate-50">
              <th class="px-2 py-1 text-left">Type</th>
              <th class="px-2 py-1 text-left">Product</th>
              <th class="px-2 py-1 text-left">From</th>
              <th class="px-2 py-1 text-left">To</th>
              <th class="px-2 py-1 text-left">Qty</th>
            </tr>
          </thead>
          <tbody>
            ${filterLedger(state.ledger).slice(0,10).map(row => `
              <tr class="border-t">
                <td class="px-2 py-1">${row.type}</td>
                <td class="px-2 py-1">${row.product}</td>
                <td class="px-2 py-1">${row.fromLocation || "-"}</td>
                <td class="px-2 py-1">${row.toLocation || "-"}</td>
                <td class="px-2 py-1">${row.qty}</td>
              </tr>
            `).join("") || `<tr><td colspan="5" class="px-2 py-2 text-center text-slate-400">No movements yet</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderKpi(title, value, subtitle) {
  return `
    <div class="bg-white rounded-xl shadow-sm p-4">
      <div class="text-xs uppercase text-slate-500 mb-1">${title}</div>
      <div class="text-2xl font-semibold text-slate-900">${value}</div>
      <div class="text-xs text-slate-500">${subtitle}</div>
    </div>
  `;
}

function filterLedger(ledger) {
  return ledger.filter(row => {
    if (state.filters.docType !== "ALL" && row.type !== state.filters.docType) return false;
    // status currently always DONE; left to extend later
    // warehouse filter: we don't store it directly in ledger, but could map via reference if needed
    return true;
  });
}

// Products

      <div class="flex-1">
        <h2 class="text-xl font-semibold text-slate-900 mb-2">Products</h2>

        <div class="overflow-x-auto bg-white rounded-xl shadow-sm">
          <table class="min-w-full text-xs">
            <thead class="bg-slate-50">
              <tr>

                <th class="px-3 py-2 text-left">Category</th>

            </thead>
            <tbody>

            <input id="prodName" class="w-full border rounded px-2 py-1.5" required />
          </div>
          <div>
            <label class="block mb-1">SKU / Code</label>
            <input id="prodSku" class="w-full border rounded px-2 py-1.5" required />

            <label class="block mb-1">Category</label>
            <input id="prodCategory" class="w-full border rounded px-2 py-1.5" />

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block mb-1">Reorder Point</label>
              <input id="prodReorderPoint" type="number" class="w-full border rounded px-2 py-1.5" />
            </div>
            <div>
              <label class="block mb-1">Reorder Qty</label>
              <input id="prodReorderQty" type="number" class="w-full border rounded px-2 py-1.5" />

          <button class="w-full bg-primary text-white py-1.5 rounded mt-2">Save Product</button>
        </form>
      </div>
    </div>
  `;
}

// Receipts
function renderReceipts() {
  return `
    <div class="flex flex-col md:flex-row gap-4">
      <div class="flex-1">
        <h2 class="text-xl font-semibold text-slate-900 mb-2">Receipts (Incoming)</h2>
        <p class="text-xs text-slate-500 mb-3">Log incoming goods from vendors; stock will increase when you create a receipt.</p>
        <div class="overflow-x-auto bg-white rounded-xl shadow-sm">
          <table class="min-w-full text-xs">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-3 py-2 text-left">Doc No</th>
                <th class="px-3 py-2 text-left">Supplier</th>
                <th class="px-3 py-2 text-left">Warehouse</th>
              </tr>
            </thead>
            <tbody>
              ${state.receipts.map(r => `
                <tr class="border-t">
                  <td class="px-3 py-1">${r.docNumber}</td>
                  <td class="px-3 py-1">${r.supplierName || "-"}</td>
                  <td class="px-3 py-1">${r.warehouse}</td>
                </tr>
              `).join("") || `<tr><td colspan="3" class="px-3 py-3 text-center text-slate-400">No receipts</td></tr>`}

// =============== FILTER & VIEW SWITCH HELPERS ==========

function updateFilter(key, value) {
  state.filters[key] = value;
  render();
}

function setView(view) {
  state.currentView = view;
  render();
}

// =============== MAIN RENDER ===========================

async function render() {
  const app = document.getElementById("app");

  if (!state.token) {
    app.innerHTML = renderLoginSignup();
    // small toggle for login/signup tabs
    setTimeout(() => {
      const loginPanel = document.getElementById("loginPanel");
      const signupPanel = document.getElementById("signupPanel");
      const tabLogin = document.getElementById("tabLogin");
      const tabSignup = document.getElementById("tabSignup");
      tabLogin.onclick = () => {
        loginPanel.classList.remove("hidden");
        signupPanel.classList.add("hidden");
        tabLogin.classList.add("bg-primary","text-white");
        tabSignup.classList.remove("bg-primary","text-white");
      };
      tabSignup.onclick = () => {
        loginPanel.classList.add("hidden");
        signupPanel.classList.remove("hidden");
        tabSignup.classList.add("bg-primary","text-white");
        tabLogin.classList.remove("bg-primary","text-white");
      };
    }, 0);
    return;
  }

  let content = "";
  switch (state.currentView) {
    case "dashboard": content = renderDashboard(); break;
    case "products": content = renderProducts(); break;
    case "receipts": content = renderReceipts(); break;
    case "deliveries": content = renderDeliveries(); break;
    case "transfers": content = renderTransfers(); break;
    case "adjustments": content = renderAdjustments(); break;
    case "stock": content = renderStock(); break;
    case "ledger": content = renderLedger(); break;
    case "settings": content = renderSettings(); break;
    case "profile": content = renderProfile(); break;
    default: content = renderDashboard();
  }

  app.innerHTML = renderLayout(content);
}

// =============== INITIAL BOOT ==========================
(async function init() {
  if (state.token) {
    await loadAllData();
  }
  render();
})();
</script>
